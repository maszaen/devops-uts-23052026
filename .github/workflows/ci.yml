name: CI/CD Pipeline

on:
  push:
    branches: [development]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm test

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: test        # hanya jalan kalau test passed
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build Docker Image
        run: docker build -t devops-uts-app .

      - name: Simulate Deploy to Staging
        run: |
          echo "==============================="
          echo "Deploying devops-uts-app..."
          echo "Environment : staging"
          echo "Status      : SUCCESS"
          echo "==============================="